
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Signal Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🚀 Crypto Signal Dashboard</h1>

    <div class="search-box">
      <input type="text" id="token" value="BTC" placeholder="Nhập token: BTC, ETH, SOL">
      <button onclick="getSignal()">Xem tín hiệu</button>
    </div>

    <div id="loading" class="loading hidden">Đang tải dữ liệu...</div>

    <div id="dashboard" class="dashboard hidden">
      <div class="card">
        <h2 id="symbol">BTC</h2>
        <p>💰 Giá: <span id="price"></span></p>
        <p>😨 Fear & Greed: <span id="fear"></span></p>
        <p>💸 Funding Rate: <span id="funding"></span></p>
      </div>

      <div class="card">
        <h3>🟢 BUY SCORE</h3>
        <div class="score buy" id="buyScore">0</div>
      </div>

      <div class="card">
        <h3>🔴 SELL SCORE</h3>
        <div class="score sell" id="sellScore">0</div>
      </div>

      <div class="card">
        <h3>📊 MARKET PHASE</h3>
        <div id="phase"></div>
      </div>

      <div class="card">
        <h3>⚡ ACTION</h3>
        <div id="action"></div>
      </div>

      <div class="card">
        <h3>📌 Last Update</h3>
        <div id="lastUpdate"></div>
      </div>

      <div class="card full">
        <h3>🧠 Trading Logic</h3>
        <ul>
          <li>MUA khi: Fear + Funding thấp + Retail bỏ cuộc</li>
          <li>BÁN khi: Euphoria + Funding nóng + Retail FOMO</li>
        </ul>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
